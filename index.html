<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optická lavice - čočky</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Simulace optické lavice</h1>
        <p>
          Zdroj světla vlevo vysílá 5 laserových paprsků. Do dráhy můžeš vkládat
          spojky i rozptylky a měnit jejich ohniskovou vzdálenost.
        </p>

        <div id="lensesContainer" class="lenses"></div>
      </section>

      <section class="benchRow">
        <aside class="sourceDirectionBanner" aria-label="Směr svazku">
          <div class="verticalSliderWrap">
            <input
              id="sourceDirection"
              type="range"
              min="-1"
              max="1"
              step="0.01"
              value="0"
              aria-label="Směr svazku"
            />
          </div>
          <button id="resetSourceDirection" class="secondary" type="button">
            Rovnoběžně
          </button>
        </aside>
        <section class="benchWrap">
          <div
            class="benchWorkspaceToolbar"
            role="toolbar"
            aria-label="Přidávání a mazání čoček"
          >
            <button
              id="addConverging"
              type="button"
              class="benchToolbarBtn"
              aria-label="Přidat spojku"
              title="Přidat spojku"
            >
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path
                  d="M12 5 L12 19 M7 10 L12 5 L17 10 M7 14 L12 19 L17 14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="addDiverging"
              type="button"
              class="benchToolbarBtn"
              aria-label="Přidat rozptylku"
              title="Přidat rozptylku"
            >
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path
                  d="M12 5 L12 19 M7 5 L12 10 L17 5 M7 19 L12 14 L17 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="resetLenses"
              type="button"
              class="benchToolbarBtn benchToolbarBtnDanger"
              aria-label="Vymazat čočky"
              title="Vymazat čočky"
            >
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path
                  d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="benchCanvasFit">
            <canvas id="benchCanvas" width="1400" height="650"></canvas>
          </div>
        </section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
